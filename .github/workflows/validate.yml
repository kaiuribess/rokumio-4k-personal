name: Validate Roku app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: python scripts/verify-package.py
      - run: python scripts/release-provenance.py
      - uses: actions/upload-artifact@v4
        with:
          name: rokumio-4k-personal
          path: |
            dist/rokumio-4k-personal.zip
            verification/package-check.json
            verification/artifact-provenance.json
            verification/*.zip.sha256
